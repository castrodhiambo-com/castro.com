<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — Castro Odhiambo Otieno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="hero" style="padding-bottom:20px;">
    <div class="container">
      <span class="eyebrow">Services</span>
      <h1 style="max-width:20ch;">Practical help, one WhatsApp message away.</h1>
      <p class="hero-lead">Every service below opens a pre-filled WhatsApp chat directly with Castro — no forms, no waiting on email.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="grid grid-3" id="servicesGrid"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="card" style="padding:44px; text-align:center;">
        <h2>Don't see what you need?</h2>
        <p>Send Castro a direct message describing your request and he'll get back to you personally.</p>
        <a href="contact.html" class="btn btn-primary">Go to Contact page</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script type="module">
  import { initSite, waLink } from "./main.js";
  initSite("services.html");

  const services = [
    { icon: "🧾", title: "KRA Services", desc: "PIN registration, iTax returns filing, and KRA compliance support.", msg: "Hello Castro, I need help with a KRA service (PIN/iTax)." },
    { icon: "🎓", title: "KUCCPS Placement", desc: "Course selection, application guidance and revision for university/college placement.", msg: "Hello Castro, I need help with my KUCCPS application." },
    { icon: "💳", title: "HELB Loan Support", desc: "New applications, loan status checks, and subsequent-loan guidance.", msg: "Hello Castro, I need help with a HELB loan application." },
    { icon: "📚", title: "Mathematics & CS Tutoring", desc: "One-on-one or group tutoring sessions, 8-4-4 and CBC aligned.", msg: "Hello Castro, I would like to book a tutoring session." },
    { icon: "🖥️", title: "Digital Literacy Training", desc: "Hands-on Excel, MS Access, Canva and CapCut training for students and teams.", msg: "Hello Castro, I'm interested in digital literacy training." },
    { icon: "🎨", title: "Design & Document Services", desc: "Professional document formatting, presentation design, and Canva graphics.", msg: "Hello Castro, I need help with a design/document task." }
  ];

  document.getElementById("servicesGrid").innerHTML = services.map(s => `
    <div class="card">
      <div class="card-icon">${s.icon}</div>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <a href="${waLink(s.msg)}" target="_blank" rel="noopener" class="btn btn-whatsapp btn-sm">Chat on WhatsApp</a>
    </div>
  `).join("");
</script>
</body>
</html>
