<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Castro.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{background:var(--slate-950);}
  .admin-login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .admin-login-card{max-width:420px; width:100%; background:var(--surface); border-radius:var(--radius-lg); padding:40px; box-shadow:var(--shadow-lg);}
  .admin-badge{width:52px; height:52px; border-radius:14px; background:var(--slate-950); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; margin:0 auto 18px;}
</style>
</head>
<body>
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-badge">A</div>
    <h1 style="text-align:center; font-size:1.6rem;">Admin Access</h1>
    <p class="center" style="margin-bottom:26px;">Restricted area. Authorized for Castro Odhiambo only.</p>

    <div class="form-error" id="formError"></div>

    <form id="adminLoginForm">
      <div class="field">
        <label for="adminEmail">Admin email</label>
        <input type="email" id="adminEmail" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-dark btn-block" id="adminLoginBtn">Access dashboard</button>
    </form>
    <p class="field-hint center" style="margin-top:16px;"><a href="index.html">← Back to main site</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script type="module">
  import { toast } from "./main.js";
  import { signIn, getMyProfile, getSession } from "./supabase-client.js";

  // If already an authenticated admin, skip straight to the dashboard
  const existingSession = await getSession();
  if (existingSession) {
    const p = await getMyProfile();
    if (p && p.role === "admin") window.location.href = "admin.html";
  }

  const form = document.getElementById("adminLoginForm");
  const errorBox = document.getElementById("formError");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    const btn = document.getElementById("adminLoginBtn");
    btn.disabled = true; btn.textContent = "Verifying…";
    try {
      await signIn({
        email: document.getElementById("adminEmail").value.trim(),
        password: document.getElementById("adminPassword").value
      });
      const profile = await getMyProfile();
      if (!profile || profile.role !== "admin") {
        throw new Error("This account does not have admin access.");
      }
      toast("Welcome back, Castro.", "success");
      setTimeout(() => (window.location.href = "admin.html"), 500);
    } catch (err) {
      errorBox.textContent = err.message || "Login failed.";
      errorBox.classList.add("show");
      btn.disabled = false; btn.textContent = "Access dashboard";
    }
  });
</script>
</body>
</html>
