<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Castro Odhiambo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230F172A%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 font-family=%22Arial%22 font-weight=%22800%22 fill=%22white%22 text-anchor=%22middle%22>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card reveal is-visible">
    <div class="admin-login-badge">CO</div>
    <h1 class="text-center" style="font-size:1.5rem;">Admin Access</h1>
    <p class="text-center" style="margin-bottom:26px;">Restricted area — authorized for Castro Odhiambo only.</p>

    <div class="form-error-banner" id="authFormError"></div>

    <form id="adminLoginForm">
      <div class="form-row">
        <div class="field">
          <label for="adminEmail">Admin email</label>
          <input type="email" id="adminEmail" required autocomplete="email" placeholder="you@example.com">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" required autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>
      <button type="submit" class="btn btn--dark btn--block">Access dashboard</button>
    </form>
    <p class="text-center" style="margin-top:18px; font-size:0.86rem; color:var(--c-text-faint);"><a href="index.html" style="color:var(--c-blue); font-weight:600;">← Back to main site</a></p>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
